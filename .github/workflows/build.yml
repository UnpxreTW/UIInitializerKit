name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pin Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: xcodebuild（iOS Simulator）
        # -skipPackagePluginValidation：SwiftStyleLint 為 build tool plugin，
        # 非互動環境無法點選信任、需跳過驗證才能執行。
        run: xcodebuild build -scheme UIInitializerKit -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation
